services:
  voicebridge-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voicebridge_platform
    ports:
      - "8080:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - OFFLINE_MODE=true
      - LOCAL_ONLY=true
      - STT_PROVIDER=local
      - TRANSLATION_PROVIDER=local
      - TTS_PROVIDER=local
      - JWT_SECRET=pvt-production-secret-key-change-in-env-32-bytes!
    volumes:
      - voicebridge_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  voicebridge_data:
    driver: local
